<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Shapes VR — Booth Preflight</title>
  <style>
    :root {
      --ok:   #22c55e;
      --warn: #f59e0b;
      --fail: #ef4444;
      --bg:   #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --mute: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; letter-spacing: 0.05em; }
    .subtitle { color: var(--mute); font-size: 0.85rem; margin-bottom: 2rem; }
    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #334155;
    }
    .check-row:last-child { border-bottom: none; }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.ok   { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.fail { background: var(--fail); }
    .dot.pending { background: #475569; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
    .check-name { flex: 0 0 140px; font-size: 0.85rem; color: var(--mute); }
    .check-msg  { flex: 1; font-size: 0.9rem; }
    .check-val  { flex: 0 0 60px; text-align: right; font-size: 0.8rem; color: var(--mute); }
    .overall-row {
      display: flex; align-items: center; gap: 1rem;
      font-size: 1rem; font-weight: bold;
    }
    .overall-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .overall-badge.ok   { background: var(--ok);   color: #052e16; }
    .overall-badge.warn { background: var(--warn);  color: #1c0a00; }
    .overall-badge.fail { background: var(--fail);  color: #1a0000; }
    .mode-badge {
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      background: #334155;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }
    .ts { color: var(--mute); font-size: 0.75rem; margin-top: 0.5rem; }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    .btn:hover { background: #2563eb; }
    .browser-checks {
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--mute);
    }
    .browser-checks h3 { color: var(--text); margin-bottom: 0.5rem; font-size: 0.9rem; }
    .bcheck { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <h1>Booth Preflight Check</h1>
  <p class="subtitle">cyber-shapes-vr · run before opening the room</p>

  <div class="card" id="server-checks">
    <div class="overall-row">
      <span>Server checks</span>
      <span class="overall-badge pending" id="overall-badge">—</span>
      <span class="mode-badge" id="mode-badge">—</span>
    </div>
    <div id="check-rows" style="margin-top:1rem;">
      <!-- Populated by JS -->
      <div class="check-row"><div class="dot pending"></div><span class="check-msg">Loading…</span></div>
    </div>
    <p class="ts" id="ts"></p>
    <button class="btn" id="refresh-btn">Refresh</button>
  </div>

  <div class="card">
    <div class="browser-checks">
      <h3>Browser checks (run in headset / audience device)</h3>
      <div class="bcheck" id="bc-autoplay">
        <div class="dot pending" id="bc-autoplay-dot"></div>
        <span>Autoplay policy — <button class="btn" id="autoplay-btn" style="padding:0.1rem 0.5rem;margin:0;font-size:0.75rem">Test</button></span>
      </div>
      <div class="bcheck" id="bc-mic">
        <div class="dot pending" id="bc-mic-dot"></div>
        <span>Mic / speaker — <button class="btn" id="mic-btn" style="padding:0.1rem 0.5rem;margin:0;font-size:0.75rem">Request</button></span>
      </div>
    </div>
  </div>

  <script src="preflight.js"></script>
</body>
</html>
