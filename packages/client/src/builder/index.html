<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Shapes — Workshop (?mode=build)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #05010a;
        font-family: 'Courier New', 'Lucida Console', monospace;
        color: #fff;
      }

      /* ── Builder shell layout ────────────────────────────────────────── */
      .builder-shell {
        display: flex;
        width: 100%;
        height: 100%;
      }

      /* Three.js canvas fills the left area */
      #builder-canvas {
        flex: 1;
        position: relative;
      }
      #builder-canvas canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Sidebar: palette + undo + layouts + glyph seeder */
      .builder-sidebar {
        width: 320px;
        min-width: 240px;
        background: rgba(5, 1, 20, 0.95);
        border-left: 1px solid #0ff4;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ── Fallback notice ─────────────────────────────────────────────── */
      .builder-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 32px;
        text-align: center;
      }
      .builder-fallback-title {
        font-size: 2rem;
        color: #0ff;
        text-shadow: 0 0 16px #0ff;
        letter-spacing: 0.12em;
      }
      .builder-fallback-notice {
        font-size: 1rem;
        color: #ccc;
        max-width: 480px;
        line-height: 1.6;
      }
      .builder-fallback-badge {
        font-size: 0.85rem;
        letter-spacing: 0.2em;
        color: #ff00ff;
        border: 1px solid #ff00ff;
        padding: 6px 16px;
        text-shadow: 0 0 8px #ff00ff;
      }

      /* ── Panel headings ──────────────────────────────────────────────── */
      h3 {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #0ff;
        text-shadow: 0 0 6px #0ff;
        border-bottom: 1px solid #0ff4;
        padding-bottom: 4px;
        margin-bottom: 8px;
      }

      /* ── Palette grid ────────────────────────────────────────────────── */
      .builder-palette-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .palette-type-btn,
      .palette-color-btn,
      .palette-render-btn {
        background: transparent;
        border: 1px solid #0ff4;
        color: #0ff;
        font-family: inherit;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        padding: 4px 6px;
        cursor: pointer;
        text-transform: uppercase;
      }
      .palette-type-btn:hover,
      .palette-color-btn:hover,
      .palette-render-btn:hover {
        border-color: #0ff;
        background: #0ff1;
      }
      .palette-type-btn.selected,
      .palette-color-btn.selected,
      .palette-render-btn.selected {
        background: #0ff2;
        border-color: #0ff;
      }
      .palette-color-row,
      .palette-render-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      .palette-spawn-btn {
        width: 100%;
        margin-top: 8px;
        background: #0ff1;
        border: 1px solid #0ff;
        color: #0ff;
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        padding: 8px;
        cursor: pointer;
        text-transform: uppercase;
        text-shadow: 0 0 6px #0ff;
      }
      .palette-spawn-btn:hover {
        background: #0ff3;
      }

      /* ── Undo/redo ───────────────────────────────────────────────────── */
      .builder-undo-row {
        display: flex;
        gap: 8px;
      }
      .builder-undo-row button {
        flex: 1;
        background: transparent;
        border: 1px solid #ff00ff4;
        color: #ff00ff;
        font-family: inherit;
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        padding: 6px;
        cursor: pointer;
        text-transform: uppercase;
      }
      .builder-undo-row button:hover {
        background: #ff00ff1;
        border-color: #ff00ff;
      }

      /* ── Settle preview ──────────────────────────────────────────────── */
      .builder-settle-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .builder-settle-status {
        font-size: 0.7rem;
        color: #aaa;
        line-height: 1.4;
      }
      .builder-settle-section button {
        background: transparent;
        border: 1px solid #ff66004;
        color: #ff6600;
        font-family: inherit;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        padding: 6px;
        cursor: pointer;
        text-transform: uppercase;
      }
      .builder-settle-section button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .builder-settle-section button:hover:not(:disabled) {
        background: #ff66001;
        border-color: #ff6600;
      }
      [data-role='builder-bake'] {
        border-color: #00ff664 !important;
        color: #00ff66 !important;
      }
      [data-role='builder-bake']:hover:not(:disabled) {
        background: #00ff661 !important;
        border-color: #00ff66 !important;
      }

      /* ── Layout panel ────────────────────────────────────────────────── */
      .layout-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .layout-panel-empty {
        font-size: 0.7rem;
        color: #666;
      }
      .layout-row {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.65rem;
        border: 1px solid #0ff2;
        padding: 4px 6px;
      }
      .layout-name {
        flex: 1;
        color: #ccc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .layout-btn {
        background: transparent;
        border: 1px solid #0ff3;
        color: #0ff;
        font-family: inherit;
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        padding: 3px 5px;
        cursor: pointer;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .layout-btn--delete {
        border-color: #ff00663;
        color: #ff0066;
      }
      .layout-btn--baseline {
        border-color: #ff66003;
        color: #ff6600;
      }
      .layout-save-section {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }
      .layout-save-input {
        flex: 1;
        background: #111;
        border: 1px solid #0ff4;
        color: #fff;
        font-family: inherit;
        font-size: 0.65rem;
        padding: 4px 6px;
      }
      .layout-save-input::placeholder {
        color: #555;
      }
      .layout-btn--save {
        background: #0ff1;
      }

      /* ── Glyph seeder ────────────────────────────────────────────────── */
      .glyph-seeder {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .glyph-seeder-canvas {
        width: 100%;
        max-width: 280px;
        height: auto;
        border: 1px solid #ff00ff4;
        cursor: crosshair;
      }
      .glyph-seeder-palette {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .glyph-seeder-swatch {
        width: 24px;
        height: 24px;
        border: 1px solid #fff3;
        cursor: pointer;
        padding: 0;
      }
      .glyph-seeder-swatch:hover {
        border-color: #fff;
      }
      .glyph-placement-preview {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .glyph-placement-label {
        font-size: 0.65rem;
        color: #ff00ff;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .glyph-ring-canvas {
        border: 1px solid #ff00ff2;
      }
      .glyph-seeder-actions {
        display: flex;
        gap: 6px;
      }
      .glyph-seeder-clear,
      .glyph-seeder-send {
        flex: 1;
        background: transparent;
        border: 1px solid #ff00ff4;
        color: #ff00ff;
        font-family: inherit;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        padding: 6px;
        cursor: pointer;
        text-transform: uppercase;
      }
      .glyph-seeder-send:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .glyph-seeder-send:hover:not(:disabled),
      .glyph-seeder-clear:hover {
        background: #ff00ff1;
        border-color: #ff00ff;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="builder-root"></div>
    <script type="module" src="./builder.ts"></script>
  </body>
</html>
