##############################################################################
# nginx.conf — cyber-shapes-vr
#
# TLS story:
#   This container serves plain HTTP on port 80. In production the container
#   sits behind a Cloudflare Tunnel (or another terminating proxy) that
#   provides HTTPS/WSS externally. WebXR, WebCodecs, and the WebSocket
#   upgrade all require a "secure context" — the browser sees https:// and
#   wss:// from the tunnel; nginx never needs to handle TLS certificates.
#
# WebSocket upgrade:
#   Clients connect to  wss://<host>/ws  which the tunnel forwards as
#   ws://web:80/ws → nginx → server:3030.  The Upgrade / Connection headers
#   must be forwarded or nginx will strip them (HTTP/1.0 behaviour).
##############################################################################

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    ##########################################################################
    # Upstream — server service (resolved by compose service name)
    ##########################################################################
    upstream cyber_server {
        server server:3030;
        keepalive 16;
    }

    ##########################################################################
    # Main server block
    ##########################################################################
    server {
        listen  80;
        server_name  _;

        # ── Security headers ────────────────────────────────────────────────
        # NOTE: nginx drops server-level add_header directives when any
        # nested location block also calls add_header.  To guarantee the
        # four security headers are sent on EVERY response we include the
        # snippet inside every location that uses add_header.
        include /etc/nginx/security-headers.conf;

        # ── WebSocket reverse proxy (/ws) ───────────────────────────────────
        # Long read timeout: WebSocket connections are persistent; the default
        # 60 s timeout would kill idle connections.
        location /ws {
            proxy_pass              http://cyber_server;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade     $http_upgrade;
            proxy_set_header        Connection  "upgrade";
            proxy_set_header        Host        $host;
            proxy_set_header        X-Real-IP   $remote_addr;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # ── Server health proxy (optional; expose for external checks) ──────
        location /healthz {
            proxy_pass          http://cyber_server/healthz;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
        }

        # ── Hashed static assets (immutable, 1 year) ───────────────────────
        # Vite appends a content hash to filenames under /assets/; they are
        # safe to cache forever.
        location /assets/ {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            add_header  Cache-Control  "public, max-age=31536000, immutable"  always;
            try_files  $uri  =404;
        }

        # ── SPA fallback (all other paths → index.html) ─────────────────────
        location / {
            root  /usr/share/nginx/html;
            try_files  $uri  $uri/  /index.html;

            # index.html must NOT be cached (SPA entry point)
            location = /index.html {
                include /etc/nginx/security-headers.conf;
                add_header  Cache-Control  "no-cache, no-store, must-revalidate"  always;
            }
        }
    }
}
