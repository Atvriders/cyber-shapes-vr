##############################################################################
# nginx-lan.conf — cyber-shapes-vr LAN-mode variant (Task C23, docker-compose.lan.yml)
#
# Unlike nginx.conf (which serves plain HTTP behind a Cloudflare Tunnel that
# terminates TLS externally), a LAN-mode booth has NO tunnel in front of it —
# this container must terminate real TLS itself, because WebXR / getUserMedia
# both require a secure context (https:// / wss://) and a phone's browser will
# refuse/scare-warn on a self-signed cert.
#
# The cert is obtained AHEAD OF THE EVENT via a DNS-01 ACME challenge (works
# without any inbound HTTP exposure — see docker-compose.lan.yml's comment
# block for the exact steps) for the SAME real domain the cloud deploy answers
# to. On booth day, split-horizon DNS makes that domain resolve to THIS
# server's LAN IP for devices on the venue Wi-Fi (see docker-compose.lan.yml).
#
# Mount the DNS-01 cert into this container at the paths below (see the
# `volumes:` block in docker-compose.lan.yml) — never bake a cert into the image.
##############################################################################

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    ##########################################################################
    # Upstream — server service (resolved by compose service name)
    ##########################################################################
    upstream cyber_server {
        server server:3030;
        keepalive 16;
    }

    ##########################################################################
    # Plain-HTTP → HTTPS redirect (a phone that scans the http:// QR by mistake
    # still lands on a secure context).
    ##########################################################################
    server {
        listen  80;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    ##########################################################################
    # Main TLS server block
    ##########################################################################
    server {
        listen  443 ssl;
        server_name  _;

        # DNS-01 cert, pre-provisioned before the event and copied to the booth
        # laptop (see docker-compose.lan.yml). Real, CA-signed — NOT self-signed —
        # so phones on the venue Wi-Fi accept it with no warning.
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # ── Security headers ────────────────────────────────────────────────
        include /etc/nginx/security-headers.conf;

        # ── WebSocket reverse proxy (/ws) ───────────────────────────────────
        location /ws {
            proxy_pass              http://cyber_server;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade     $http_upgrade;
            proxy_set_header        Connection  "upgrade";
            proxy_set_header        Host        $host;
            proxy_set_header        X-Real-IP   $remote_addr;
            # C24 audit (MF2) — spoof-resistant per-IP keying (clientIpOf, index.ts).
            # LAN has NO Cloudflare, so this nginx is the ONLY trusted hop: APPEND the
            # real client peer to X-Forwarded-For (the server keys on the rightmost
            # hop with TRUSTED_PROXY_HOPS=0 → a client-forged leftmost XFF is ignored)
            # and STRIP any inbound CF-Connecting-IP (nothing legitimately sets it on
            # a LAN, so any value is a forgery — it must never reach clientIpOf rung 1).
            proxy_set_header        X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header        CF-Connecting-IP  "";
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # ── Server health proxy ─────────────────────────────────────────────
        location /healthz {
            proxy_pass          http://cyber_server/healthz;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
        }

        # ── Preflight/API proxy (LAN/loopback-gated at the server) ──────────────
        #    C24 audit (MF2): this nginx IS a hop in front of the server, so the
        #    server's socket peer is nginx's bridge IP, NOT the real client — the
        #    LAN/staff gate on GET /api/preflight + /api/metrics/day and every per-IP
        #    limiter must therefore key on the nginx-appended X-Forwarded-For hop
        #    (clientIpOf rung 2, packages/server/src/index.ts), NOT the socket peer.
        #    We append the real peer to XFF and strip any client-forged
        #    CF-Connecting-IP; the server runs with TRUST_CF_CONNECTING_IP=false and
        #    TRUSTED_PROXY_HOPS=0 (this is the sole trusted hop). See docker-compose.lan.yml.
        location /api/ {
            proxy_pass          http://cyber_server;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    CF-Connecting-IP "";
        }

        # ── Hashed static assets (immutable, 1 year) ───────────────────────
        location /assets/ {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            add_header  Cache-Control  "public, max-age=31536000, immutable"  always;
            try_files  $uri  =404;
        }

        # ── SPA fallback (all other paths → index.html) ─────────────────────
        location / {
            root  /usr/share/nginx/html;
            try_files  $uri  $uri/  /index.html;

            location = /index.html {
                include /etc/nginx/security-headers.conf;
                add_header  Cache-Control  "no-cache, no-store, must-revalidate"  always;
            }
        }
    }
}
